version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/evcc1.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app
build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: evcc
    source: docker.io/evcc/evcc
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    create_if_missing: true
    application:
      language: zh
      brief: "电动车充电控制"
      description: "evcc 统一管理家用充电桩与光伏、电池、电价，按太阳能余量自动调节充电功率，用电更省。"
      keywords: "充电桩, 光伏, 电动车, 能耗, 智能家居"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
  private:
    enabled: false
